<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MarketAtlas Dashboard</title>
<link rel="stylesheet" href="/style.css" />
<script src="/lib/lightweight-charts.js"></script>
</head>
<body>
<header>
  <h1>MarketAtlas</h1>
  <nav>
    <button id="tabAudit" class="tab active">Audit</button>
    <button id="tabDash" class="tab">Dashboard</button>
  </nav>
  <span id="status" class="status"></span>
</header>
<div class="layout">
  <aside id="sidebar">
    <div id="auditSidebar" class="sidebar-section">
      <div class="sidebar-title">Audit files</div>
      <ul id="fileList"></ul>
    </div>
    <div id="dashSidebar" class="sidebar-section hidden">
      <div class="sidebar-title">Portfolios</div>
      <ul id="portfolioList"></ul>
      <div class="sidebar-title" style="margin-top:12px">Portfolio</div>
      <select id="dashPortfolio" style="width:90%;margin:4px 5%;background:#161b22;color:#d6d9e0;border:1px solid #2a313c;padding:3px;border-radius:4px"></select>
      <div class="sidebar-title" style="margin-top:12px">Instrument</div>
      <select id="dashInstr" style="width:90%;margin:4px 5%;background:#161b22;color:#d6d9e0;border:1px solid #2a313c;padding:3px;border-radius:4px"></select>
      <div class="sidebar-title" style="margin-top:12px">Timeframe</div>
      <select id="dashTf" style="width:90%;margin:4px 5%;background:#161b22;color:#d6d9e0;border:1px solid #2a313c;padding:3px;border-radius:4px">
        <option>1d</option><option>1h</option><option>5m</option><option>1m</option><option>1w</option>
      </select>
      <div class="sidebar-title" style="margin-top:12px">Trades</div>
      <div id="tradeFilter" style="padding:4px 8px">
        <select id="tradeStatusFilter" style="width:100%;background:#161b22;color:#d6d9e0;border:1px solid #2a313c;padding:3px;border-radius:4px">
          <option value="">all</option>
          <option value="open">open</option>
          <option value="closed">closed</option>
        </select>
      </div>
      <div id="tradeTree" style="max-height:400px;overflow:auto"></div>
    </div>
  </aside>
  <main id="main">
    <!-- Audit view -->
    <div id="auditView">
      <div id="fileMeta" class="meta"></div>
      <div id="filters" class="filters hidden">
        <select id="topicFilter"><option value="">all topics</option></select>
        <select id="typeFilter"><option value="">all types</option></select>
        <input id="searchBox" type="text" placeholder="search payload / header..." />
        <button id="searchBtn">Search</button>
        <label>page size <select id="pageSize"><option>100</option><option selected>200</option><option>500</option></select></label>
      </div>
      <div id="tableWrap" class="tablewrap hidden">
        <table id="msgTable">
          <thead><tr><th>#</th><th>Time</th><th>Topic</th><th>Type</th><th>Summary</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="pager" class="pager hidden">
        <button id="prevBtn">Prev</button>
        <span id="pageInfo"></span>
        <button id="nextBtn">Next</button>
      </div>
    </div>
    <!-- Dashboard view -->
    <div id="dashView" class="hidden">
      <!-- Unified control strip -->
      <div id="dashControls" class="dash-controls">
        <label>Portfolio
          <select id="dashPortfolio" style="background:#161b22;color:#d6d9e0;border:1px solid #2a313c;padding:4px 6px;border-radius:4px"></select>
        </label>
        <label>Instrument
          <select id="dashInstr" style="background:#161b22;color:#d6d9e0;border:1px solid #2a313c;padding:4px 6px;border-radius:4px"></select>
        </label>
        <label>Timeframe
          <select id="dashTf" style="background:#161b22;color:#d6d9e0;border:1px solid #2a313c;padding:4px 6px;border-radius:4px">
            <option>1d</option><option>1h</option><option>5m</option><option>1m</option><option>1w</option>
          </select>
        </label>
        <label>Audit file
          <select id="dashAuditFile" style="background:#161b22;color:#d6d9e0;border:1px solid #2a313c;padding:4px 6px;border-radius:4px">
            <option value="">(none)</option>
          </select>
        </label>
        <button id="dashLoad" class="btn btn-primary">Load</button>
        <button id="dashLoadTimeline" class="btn btn-secondary">Indicators</button>
        <div class="overlay-toggles">
          <label><input type="checkbox" id="showEma" checked> EMA</label>
          <label><input type="checkbox" id="showAtr"> ATR</label>
          <label><input type="checkbox" id="showSupport" checked> S/R</label>
          <label><input type="checkbox" id="showSwings" checked> Swings</label>
          <label><input type="checkbox" id="showSetups" checked> Setups</label>
        </div>
      </div>
      <!-- Chart -->
      <div id="chartWrap" style="position:relative">
        <div id="chartContainer" style="width:100%;height:500px;margin-top:8px"></div>
        <div id="chartTooltip" class="chart-tooltip hidden"></div>
        <div id="chartLoading" class="chart-loading hidden">Loading…</div>
      </div>
      <!-- Time-Machine scrubber -->
      <div id="timeMachine" class="time-machine">
        <div class="tm-controls">
          <button id="tmPlay" class="btn btn-secondary" title="Play/Pause">Play</button>
          <button id="tmStepBack" class="btn btn-secondary" title="Step back one bar">◀</button>
          <button id="tmStepFwd" class="btn btn-secondary" title="Step forward one bar">▶</button>
          <select id="tmSpeed" class="tm-speed">
            <option value="250">0.5x</option>
            <option value="125" selected>1x</option>
            <option value="60">2x</option>
            <option value="30">4x</option>
          </select>
          <button id="tmLive" class="btn btn-primary" title="Jump to live (show all)">Live</button>
          <span id="tmLabel" class="tm-label">Live (all bars)</span>
        </div>
        <input id="tmScrubber" type="range" min="0" max="0" value="0" step="1" class="tm-scrubber" />
      </div>
    </div>
  </main>
  <section id="detail" class="detail hidden">
    <div class="detail-head">
      <span id="detailTitle"></span>
      <button id="closeDetail">Close</button>
    </div>
    <pre id="detailJson"></pre>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
