[package]
name = "reliant-messaging"
version = "0.1.0"
edition = "2024"

[features]
default = ["nats"]
nats = ["dep:async-nats", "dep:tokio", "dep:futures", "dep:bytes"]

[dependencies]
reliant-datamodel = { path = "../datamodel" }
rmp-serde = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"
async-nats = { version = "0.40", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "sync"] }
futures = { version = "0.3", optional = true, default-features = false }
bytes = { version = "1", optional = true }
