[package]
name = "reliant-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
reliant-datamodel = { path = "../datamodel" }
reliant-indicators = { path = "../indicators" }
reliant-messaging = { path = "../messaging" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
reliant-store = { path = "../store" }
